[project]
name = "agent-brainswarm"
version = "0.0.1"
description = "Generate ideas at scale with a swarm of agents, critique them with justified criticism, and rank them honestly."
readme = "README.md"
authors = [
    { name = "Kyle", email = "kyleyhw@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.2",
]

[project.scripts]
brainswarm = "agent_brainswarm.cli:main"

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ty.environment]
python-version = "3.12"   # matches requires-python; ty otherwise assumes "3.14"

[tool.ty.terminal]
error-on-warning = true   # any diagnostic, warning or error, fails the run

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]
